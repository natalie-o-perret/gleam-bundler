---
name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: Go 1.24
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.24"
          check-latest: true
          cache: false
      - run: go test ./...
      - run: go vet ./...

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            executable_suffix: ""
          - os: macos-15
            executable_suffix: ""
          - os: macos-15-intel
            executable_suffix: ""
          - os: windows-2025
            executable_suffix: ".exe"

    steps:
      - name: Check out source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Go
        # v7.1.0
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Install Erlang and Gleam
        # v1.24.1
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.1.2"
          gleam-version: "1.19.2"
          version-type: strict

      - name: Check formatting
        shell: bash
        run: |
          gofmt -w .
          git diff --exit-code

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build release binary
        shell: bash
        run: >-
          go build
          -trimpath
          -ldflags="-s -w"
          -o "./gleam-bundler${{ matrix.executable_suffix }}"
          .

      - name: Bundle the fixture
        shell: bash
        run: >-
          "./gleam-bundler${{ matrix.executable_suffix }}"
          bundle
          --out "./test/fixture/bundle${{ matrix.executable_suffix }}"
          ./test/fixture

      - name: Remove build-time Erlang
        shell: pwsh
        run: >-
          Rename-Item
          -LiteralPath $env:INSTALL_DIR_FOR_OTP
          -NewName "otp.disabled"

      - name: Run without build-time Erlang
        shell: bash
        run: >-
          ERL_ROOTDIR=/does/not/exist
          "./test/fixture/bundle${{ matrix.executable_suffix }}"
