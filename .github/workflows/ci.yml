---
name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            executable_suffix: ""
          - os: macos-15
            executable_suffix: ""
          - os: macos-15-intel
            executable_suffix: ""
          - os: windows-2025
            executable_suffix: ".exe"

    steps:
      - name: Check out source
        # v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - name: Install Erlang and Gleam
        # v1.24.1
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.1.2"
          gleam-version: "1.19.2"
          version-type: strict

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release

      - name: Bundle the fixture
        shell: bash
        run: >-
          "./target/release/gleam-bundler${{ matrix.executable_suffix }}"
          bundle
          --out "./test/fixture/bundle${{ matrix.executable_suffix }}"
          ./test/fixture

      - name: Remove build-time Erlang
        shell: pwsh
        run: >-
          Rename-Item
          -LiteralPath $env:INSTALL_DIR_FOR_OTP
          -NewName "otp.disabled"

      - name: Run without build-time Erlang
        shell: bash
        run: >-
          ERL_ROOTDIR=/does/not/exist
          "./test/fixture/bundle${{ matrix.executable_suffix }}"
