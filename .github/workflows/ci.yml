---
name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            executable_suffix: ""
          - os: macos-15
            executable_suffix: ""
          - os: macos-15-intel
            executable_suffix: ""
          - os: windows-2025
            executable_suffix: ".exe"

    steps:
      - name: Check out source
        # v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Install Go
        # v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Erlang and Gleam
        # v1.24.1
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.1.2"
          gleam-version: "1.19.2"
          version-type: strict

      - name: Check formatting
        shell: bash
        run: |
          gofmt -w .
          git diff --exit-code

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build release binary
        shell: bash
        run: >-
          go build
          -trimpath
          -ldflags="-s -w"
          -o "./gleam-bundler${{ matrix.executable_suffix }}"
          .

      - name: Bundle the fixture
        shell: bash
        run: >-
          "./gleam-bundler${{ matrix.executable_suffix }}"
          bundle
          --out "./test/fixture/bundle${{ matrix.executable_suffix }}"
          ./test/fixture

      - name: Remove build-time Erlang
        shell: pwsh
        run: >-
          Rename-Item
          -LiteralPath $env:INSTALL_DIR_FOR_OTP
          -NewName "otp.disabled"

      - name: Run without build-time Erlang
        shell: bash
        run: >-
          ERL_ROOTDIR=/does/not/exist
          "./test/fixture/bundle${{ matrix.executable_suffix }}"
